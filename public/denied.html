<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1d1a" />
    <title>Range Finder: not invited</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a1d1a; color: #ecefe8; }
      main { max-width: 420px; padding: 24px 20px; text-align: center; }
      h1 { margin: 16px 0 8px; font-size: 28px; }
      p { line-height: 1.5; color: #9ba39a; margin: 0 0 20px; }
      a.btn { display: block; margin: 10px 0; padding: 16px; border-radius: 14px; background: #e8a33c; color: #1a1d1a; text-decoration: none; font-weight: 600; font-size: 18px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Not invited yet</h1>
      <p>You're signed in, but this account hasn't been invited to Range Finder. Ask Sean for an invite and tell him which account you used.</p>
      <a class="btn" href="/.auth/logout?post_logout_redirect_uri=/login.html">Sign out</a>
    </main>
  </body>
</html>
